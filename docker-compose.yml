services:
  postgres:
    image: postgres:17
    container_name: sigpqr-postgres
    environment:
      POSTGRES_USER: sigpqr
      POSTGRES_PASSWORD: sigpqr
      POSTGRES_DB: sigpqr_auth
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sigpqr"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:4-management
    container_name: sigpqr-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  zipkin:
    image: openzipkin/zipkin
    container_name: sigpqr-zipkin
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "9411:9411"
      - "4318:4318"

volumes:
  pgdata:
